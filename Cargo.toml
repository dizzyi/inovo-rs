[workspace]
resolver = "2"
members = ["inovo-rs", "inovo-rs-macro"]

[workspace.dependencies]
chrono = "0.4.31"
local-ip-address = "0.6.1"
nalgebra = "0.33.2"
net2 = "0.2.39"
websocket = "0.27.0"
serde = { version = "1.0.192", features = ["derive"] }
serde_json = "1.0.108"
colored = "3.0.0"
thiserror = "2.0.12"
roslibrust = { version = "0.14.0", features = ["rosbridge"] }
serde_repr = "0.1.20"
tokio = { version = "1.45.1", features = ["full"] }

inovo-rs-macro = { path = "./inovo-rs-macro" }
