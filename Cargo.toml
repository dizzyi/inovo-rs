[workspace]
resolver = "2"
members = ["inovo-rs", "inovo-rs-macro", "inovo-cli"]

[workspace.dependencies]
tracing = "0.1.41"

derive_more = { version = "2.0.1", features = ["deref", "deref_mut"] }

colored = "3.0.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1.47.1", features = ["full"] }
roslibrust = { version = "0.15.0", features = ["rosbridge"] }
nalgebra = "0.34.1"

inovo-rs-macro = { path = "./inovo-rs-macro" }
inovo-rs = { path = "./inovo-rs" }
