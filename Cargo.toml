[workspace]
resolver = "2"
members = ["inovo-rs", "inovo-rs-macro", "inovo-cli"]

[workspace.dependencies]
tracing = "0.1.41"

derive_more = { version = "2.0.1", features = ["deref", "deref_mut"] }

colored = "3.0.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1.48.0", features = ["full"] }
roslibrust = { version = "0.16.0", features = ["rosbridge"] }
nalgebra = "0.34.1"
chrono = "0.4.42"
local-ip-address = "0.6.1"
thiserror = "2.0.17"
serde_repr = "0.1.20"
async-trait = "0.1.88"

inovo-rs-macro = { path = "./inovo-rs-macro" }
inovo-rs = { path = "./inovo-rs" }


tracing-subscriber = { version = "0.3.20" }
anyhow = { version = "1.0.100" }
