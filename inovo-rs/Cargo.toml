[package]
name = "inovo-rs"
version = "0.1.1"
edition = "2021"
authors = ["Alan, CHUNG Ho Lun, dizzyi@github, deeralan827@gmail.com"]
description = "API for intergrating inovo robot arm."
license = "MIT"
readme = "README.md"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = ["scan"]
scan = ["dep:netdev", "dep:dns-lookup"]


[dependencies]
tracing = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }

tokio = { workspace = true }

nalgebra = { workspace = true }

local-ip-address = { workspace = true }

roslibrust = { workspace = true }

thiserror = { workspace = true }

derive_more = { workspace = true }
serde_repr = { workspace = true }
async-trait = { workspace = true }

netdev = { workspace = true, optional = true }
dns-lookup = { workspace = true, optional = true }

inovo-rs-macro = { workspace = true }

[dev-dependencies]
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
dotenv = { workspace = true }
